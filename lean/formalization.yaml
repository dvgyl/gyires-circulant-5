# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
# Metadata for the Lean project in this directory, in the formalization.yaml v0.4 format used by Palomar.
version: "v0.4"

project:
  name: "Gyires's permanent inequality for nonnegative circulant matrices of order five"
  description: "A machine-checked proof that Gyires's permanent inequality holds for every doubly stochastic circulant matrix of order five, with its equality case. Gyires conjectured in 1978 that every doubly stochastic n x n matrix A satisfies 4 per(A)^2 / (per(A A^T) + per(A^T A) + 2 per(A^2)) >= n!/n^n, with equality only at the matrix J_n with all entries 1/n (Conjecture 20 in the 2005 survey of Cheon and Wanless of open problems on permanents); the conjecture is open for n >= 5. The doubly stochastic circulants of order five are the convex combinations of the five powers of the cyclic permutation matrix, a four-dimensional family that includes matrices with zero entries. For them the ratio is at least 5!/5^5 = 24/625, the denominator is positive, and equality holds exactly at J_5. The proof establishes the stronger inequality 24 per(C C^T) <= 625 per(C)^2 for every circulant C of order five with nonnegative entries, with equality exactly for the constant matrices, together with the homogeneous form of Gyires's inequality for these matrices and a quantitative margin: if z_1, ..., z_4 are the gaps between consecutive values when the circulant weights (the entries of the first row) are sorted, then 625 per(C)^2 - 24 per(C C^T) >= 484 (z_1^10 + z_2^10 + z_3^10 + z_4^10), with equality for the weights (1, 1, 0, 0, 0), so that 484 is the largest constant with this property. The proof reduces all orderings of the weights, by affine changes of indices modulo five, to six canonical orderings; for each of them the defect, written in the smallest weight and the gaps, is a polynomial with nonnegative integer coefficients; Lean checks every coefficient identity and inequality. Context: the result belongs to the theory of permanent inequalities for doubly stochastic matrices, the setting of van der Waerden's permanent conjecture (proved in 1980-1981) and of the open problems collected in Minc's surveys of permanents and in the update by Cheon and Wanless (Linear Algebra Appl. 403, 2005); Gyires's conjecture is elementary for n = 2, the inequality for n = 3 was proved by D. K. Chang (1990), and the case n = 4 was proved in 2026 by C. Ozols with a computer-assisted Lean proof. The intended audience is researchers working on permanents of doubly stochastic matrices and on the problems of Minc's list. The paper also discusses whether the strong inequality (n!/n^n) per(A A^T) <= per(A)^2, which implies Gyires's inequality (a reduction formalized here for every n), holds for all doubly stochastic matrices. The repository contains a self-contained paper."
  authors: ["Dev D. Goyal"]
  responsible_maintainers: ["Dev D. Goyal"]
  license: "Apache-2.0"

classification:
  arxiv: [math.CO, math.RA]
  msc2020: [15A15, 15B51, 15B05, 15A45, 68V05]

sources:
  - title: "Gyires's permanent inequality for nonnegative circulant matrices of order five, presented in the paper of this repository"
    type: original-proof
    authors: ["Dev D. Goyal"]
    location: "https://github.com/dvgyl/gyires-circulant-5/tree/main/preprints/Gyires-inequality-for-circulants-of-order-five"
    relationship: other
    note: "The result is first presented in this repository, in a self-contained paper that has not been peer reviewed. The proof was found by an AI system (see automation). Novelty has not been established beyond limited searches for earlier work, and no priority is claimed. The searches covered the survey of Cheon and Wanless and the works cited in the paper, general web searches for Gyires's conjecture and for permanent inequalities for circulant matrices, the account of prior work in C. Ozols's repository cozuya/gyires-permanent-4x4 (commit 244f48c, 19 October 2026), and the Lean collections google-deepmind/formal-conjectures (commit 37f0808, 24 October 2026), openai/math (commit 1581d4c, 12 October 2026) and plby/lean-proofs (commit 8822f7d, 15 September 2026). None of them treats the circulant case. Gyires's 1978 article and Y. Lavi's catalogue of Minc's conjectures (see the corresponding source) could not be consulted."

  - title: "On permanent inequalities"
    type: paper
    authors: ["Béla Gyires"]
    location: "Combinatorics (Proc. Fifth Hungarian Colloq., Keszthely, 1976), A. Hajnal and V. T. Sós (eds.), Colloq. Math. Soc. János Bolyai 18, North-Holland, 1978, 471-484"
    relationship: other
    note: "The origin of the conjecture (the problem source). The article was not consulted; the statement is taken from the survey of Cheon and Wanless."

  - title: "An update on Minc's survey of open problems involving permanents"
    type: paper
    authors: ["Gi-Sang Cheon", "Ian M. Wanless"]
    location: "Linear Algebra and its Applications 403 (2005), 314-342"
    relationship: other
    note: "States Gyires's conjecture as Conjecture 20, in the form used here (with the conjugate transpose, which is the transpose for real matrices); the problem source for the statement."
    author_endorsement: not-contacted

  - title: "On two permanental conjectures"
    type: paper
    authors: ["D. K. Chang"]
    location: "Linear and Multilinear Algebra 26 (1990), 207-213"
    relationship: background
    note: "Proves the inequality of Gyires's conjecture for n = 3 (according to the publisher's abstract). According to Ozols's account of prior work, Cheon and Wanless also record a sufficient condition of Chang for every n (all entries at least (n-2)/(n-1)^2); for n = 5 it covers only the doubly stochastic circulants with all weights in [3/16, 1/4], a neighbourhood of J_5. Background only; the full text was not consulted."

  - title: "Gyires' permanent inequality for 4x4 doubly stochastic matrices"
    type: other
    authors: ["Chris Ozols"]
    id: "https://github.com/cozuya/gyires-permanent-4x4/tree/244f48c270d0a4d0801383e15202886b384b2d67"
    relationship: background
    note: "Proves Gyires's conjecture for all doubly stochastic 4 x 4 matrices, with its equality case and the analogue 3 per(A A^T) <= 32 per(A)^2 of the strong inequality, by a computer-assisted proof formalized in Lean whose finite certificate is checked with native_decide. Background: the case n = 4 of the same conjecture, by different methods. Its account of prior work is the source of the information on Lavi's catalogue below. Its Lean proof of the Gram comparison is adapted here (see related_formalizations)."
    license: Apache-2.0
    author_endorsement: not-contacted

  - title: "Minc's list, Conjecture 20 (catalogue of Minc's conjectures on permanents)"
    type: web discussion
    authors: ["Yair Lavi"]
    id: "https://yair-lavi.com/mincs-list/conjecture-20/index.html"
    relationship: background
    note: "Reported by Ozols's account of prior work (checked 19 October 2026) to list Gyires's conjecture as open and to announce, without proofs, results for matrices in Omega_4 with a zero entry, for matrices near J_n and for special families. The page could not be accessed during the preparation of this formalization, so its content, and in particular whether its special families include circulants, could not be checked; any overlap with the present result is unknown."

related_formalizations:
  - id: "https://github.com/cozuya/gyires-permanent-4x4/tree/244f48c270d0a4d0801383e15202886b384b2d67"
    relationship: adapts
    note: "Circulant5/PermanentGram.lean adapts RequestProject/Reduction.lean of this repository (the comparison 2 per(M N^T) <= per(M M^T) + per(N N^T) for real square matrices; Apache-2.0, with attribution and a modification notice). The rest of the present formalization is independent of it. That repository formalizes the case n = 4 of Gyires's conjecture."

status:
  scope: >-
    The ten theorems listed under alignment are stated in Challenges/GyiresCirculant5.lean using
    Mathlib alone (Matrix.permanent, Matrix.circulant, doublyStochastic) and are proved in
    Solutions/GyiresCirculant5.lean from the library Circulant5. They cover Gyires's inequality, its
    equality case and the positivity of its denominator for doubly stochastic circulant matrices of
    order five, the homogeneous form and the strong inequality 24 per(A A^T) <= 625 per(A)^2 for
    circulants of order five with nonnegative entries, with their equality cases, and the margin in
    sorted-gap coordinates with its attainment and the sharpness of its constant 484. The library also
    formalizes several remarks of the paper: the case n = 2 of the conjecture, the characterization
    of the doubly stochastic circulants of order five as the convex combinations of the powers of the
    cyclic permutation matrix, and, for real square matrices of every size, the reduction of Gyires's
    inequality to the strong inequality. The general conjecture, for all
    doubly stochastic matrices of order five or of any order n >= 5, is not formalized and not
    proved. The coefficient statistics of the chamber polynomials (996 positive and 5 zero
    coefficients per chamber, the pure-power coefficients and the least positive coefficient) are
    checked by exact computation in verification/independent_checks.gp but not stated in Lean; they
    are not needed by the theorems.
    The remarks of the Discussion section that rest on random tests or on the literature are not
    formalized.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: [propext, Classical.choice, Quot.sound]

fidelity:
  divergences: >-
    The Challenge uses Mathlib's conventions, each equivalent to the source. Mathlib's
    Matrix.permanent is the sum over permutations s of the products of the entries A (s i) i, which
    equals the usual sum of products of the entries A i (s i) after replacing s by its inverse. The
    conjugate transpose A* of Cheon and Wanless is the transpose A^T for real matrices. Mathlib's
    doublyStochastic requires nonnegative entries, A *ᵥ 1 = 1 and 1 ᵥ* A = 1, which is equivalent to
    all row and column sums being 1 (Mathlib's mem_doublyStochastic_iff_sum). A matrix is circulant
    if it equals Matrix.circulant v for some v, with entries v (i - j) modulo five; the paper writes
    circulants as C(w) with entries w (j - i), and the library as circ w, which is the transpose of
    Matrix.circulant w (circulant_eq_transpose_circ); both describe the same set of matrices. The
    constant n!/n^n is Nat.factorial 5 / 5 ^ 5 in the reals, and J_5 is the constant matrix with
    entries 5⁻¹. The ratio is stated with real division; the positivity of the denominator is a
    separate compared theorem, so the division is never by zero. The homogeneous and strong
    inequalities are stated for all circulants with nonnegative entries, without normalization; their
    equality cases are the constant matrices, including the zero matrix. The margin is stated for
    every nonnegative weight vector v and every permutation that sorts it, with the gaps
    v (σ (j+1)) - v (σ j). Steps checked only by computation are listed under status.scope.

automation:
  methods:
    - method: autonomous
      models: ["GPT-6 (ChatGPT, Pro reasoning)"]
      framework: "ChatGPT"
      tool_setup: "Working autonomously from prompts by Dev D. Goyal, proposed the problem, found the proof and the chamber certificate, wrote the Lean library Circulant5 for Lean 4.19 (including the generated certificate files under Circulant5/Coefficients and Circulant5/CompactInputs), and wrote a first draft of the paper."
    - method: agent
      models: ["Claude Opus 5.5"]
      framework: "Claude Code"
      tool_setup: "Ported the library to Lean 4.35.0 and the module system, wrote Circulant5/MathlibStatements.lean (the translation to Mathlib's Matrix.circulant, the margin for an arbitrary sorting permutation with its attainment and sharpness, and the uniqueness of the reduction to a canonical ordering) and Circulant5/Remarks.lean (the formalized remarks of the paper), the Challenge and Solution modules and the Comparator configuration, rebuilt the project, audited the axioms, compared the Lean definitions with the source, wrote the PARI/GP checks in verification/, and wrote the paper in its present form."
  notes: "Dev D. Goyal directed the project, chose which problems to pursue, requested proofs, formal verification and revisions, and reviewed the results, but did not supply proof strategies. AUTHORSHIP.md at the repository root records each contribution."

review:
  status: agent-reviewed
  reviewers: ["Claude Opus 5.5 (Claude Code)", "Dev D. Goyal"]
  notes: "An agent separate from the one that wrote the original proofs (ChatGPT) rebuilt the formalization, checked that every theorem depends only on the standard axioms, compared each Lean definition with the statement of Cheon and Wanless, recomputed the chamber certificate and tested every result with exact computations, and read the proofs in the paper. The same agent wrote the Challenge statements and their docstrings, Circulant5/MathlibStatements.lean, Circulant5/Remarks.lean, the paper in its present form and the PARI/GP checks, so its checks are independent of ChatGPT's work and of the certificate generator but not of its own files. The Challenge statements have been checked by Lean and by Comparator, and they and the paper have been read by separate Claude Opus 5.5 and Claude Sonnet 5.5 agents, one acting as a Palomar referee; no human expert has reviewed them. Dev D. Goyal reviewed the proofs; this review is not an independent expert validation. The paper has not been peer reviewed."

alignment:
  namespace: "GyiresCirculant5"
  statements:
    - source: "Cheon and Wanless, Conjecture 20 (Gyires), for doubly stochastic circulants of order 5; paper, Corollary 3.3"
      lean: "GyiresCirculant5.gyires_ratio"
      module: "Challenges.GyiresCirculant5"
      status: "proved"
      note: "The ratio 4 per(A)^2 / (per(A A^T) + per(A^T A) + 2 per(A^2)) is at least 5!/5^5 for every doubly stochastic A of the form Matrix.circulant v."
    - source: "Conjecture 20, equality case, for doubly stochastic circulants of order 5; paper, Corollary 3.3"
      lean: "GyiresCirculant5.gyires_ratio_eq_iff"
      module: "Challenges.GyiresCirculant5"
      status: "proved"
      note: "Equality holds exactly at J_5."
    - source: "Paper, Corollary 3.3 (positive denominator)"
      lean: "GyiresCirculant5.gyires_denominator_pos"
      module: "Challenges.GyiresCirculant5"
      status: "proved"
    - source: "Paper, Corollary 3.3 (homogeneous form)"
      lean: "GyiresCirculant5.gyires_homogeneous"
      module: "Challenges.GyiresCirculant5"
      status: "proved"
      note: "For every circulant of order 5 with nonnegative entries, without normalization."
    - source: "Paper, Corollary 3.3 (homogeneous form, equality case)"
      lean: "GyiresCirculant5.gyires_homogeneous_eq_iff"
      module: "Challenges.GyiresCirculant5"
      status: "proved"
      note: "Equality exactly for the constant matrices."
    - source: "Paper, Theorem 3.1 (strong inequality)"
      lean: "GyiresCirculant5.strong_inequality"
      module: "Challenges.GyiresCirculant5"
      status: "proved"
      note: "(5!/5^5) per(A A^T) <= per(A)^2 for circulants of order 5 with nonnegative entries."
    - source: "Paper, Theorem 3.1 (equality case)"
      lean: "GyiresCirculant5.strong_inequality_eq_iff"
      module: "Challenges.GyiresCirculant5"
      status: "proved"
      note: "Equality exactly for the constant matrices."
    - source: "Paper, Theorem 3.2 (margin in sorted-gap coordinates)"
      lean: "GyiresCirculant5.strong_margin"
      module: "Challenges.GyiresCirculant5"
      status: "proved"
      note: "For every nonnegative weight vector and every permutation that sorts it."
    - source: "Paper, Theorem 3.2 (the margin is attained)"
      lean: "GyiresCirculant5.strong_margin_attained"
      module: "Challenges.GyiresCirculant5"
      status: "proved"
      note: "Equality with nonzero gaps, for v = (1, 1, 0, 0, 0)."
    - source: "Paper, Theorem 3.2 (sharpness of the constant 484)"
      lean: "GyiresCirculant5.strong_margin_sharp"
      module: "Challenges.GyiresCirculant5"
